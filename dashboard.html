<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Santri - Portal Daarul Azmi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Navbar Sederhana -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex flex-wrap justify-between items-center gap-3">
        <a href="#beranda" class="text-lg font-bold text-white no-underline">Portal Santri Daarul Azmi</a>
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Keluar</button>
    </header>
    <nav aria-label="Navigasi dashboard" class="bg-slate-800 text-white px-4 py-3 shadow-md sticky top-0 z-10 flex gap-3 sm:gap-6 overflow-x-auto whitespace-nowrap">
        <a href="#beranda" class="text-white hover:text-blue-200">Beranda</a>
        <a href="./profile.html" class="text-white hover:text-blue-200">Profil Santri</a>
        <a href="./admin.html" class="text-white hover:text-blue-200">Panel Admin</a>
        <a href="https://daarulazmi.ponpes.id/" class="text-white hover:text-blue-200">Website Pondok</a>
    </nav>

    <!-- Konten Utama Dashboard -->
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <!-- Kartu Sambutan -->
        <div id="beranda" class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Selamat Datang di Dashboard</h2>
            <p class="text-gray-600 mt-1">Pilih menu Profil Santri untuk mengelola informasi profil Anda.</p>
            <p id="dashboard-status" class="mt-3 text-sm font-medium" role="status" aria-live="polite"></p>
        </div>
    </main>

    <script type="module" src="./dashboard.js"></script>
</body>
</html>
