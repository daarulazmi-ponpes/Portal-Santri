<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Santri - Portal Daarul Azmi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!-- Navbar Sederhana -->
    <nav class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-lg font-bold">Portal Santri Daarul Azmi</h1>
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Keluar</button>
    </nav>

    <!-- Konten Utama Dashboard -->
    <main class="max-w-4xl mx-auto p-6 mt-6">

        <!-- Kartu Sambutan -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Selamat Datang di Dashboard</h2>
            <p class="text-gray-600 mt-1">Kelola dan perbarui informasi profil santri Anda di bawah ini.</p>
        </div>

        <!-- Form Edit Profil Santri -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6">
            <h3 class="text-xl font-bold mb-4 text-gray-800">Form Pengisian & Edit Profil Santri</h3>

            <form id="profile-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                    <input type="text" id="full-name" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" required placeholder="Masukkan nama lengkap santri" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">NIS (Nomor Induk Siswa)</label>
                    <input type="text" id="nis" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Masukkan NIS" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nomor Telepon</label>
                    <input type="text" id="phone" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Contoh: 08123456789" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Alamat</label>
                    <textarea id="address" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
                </div>
                <button type="submit" id="save-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                    Simpan Profil
                </button>
            </form>

            <p id="profile-status" class="mt-3 text-sm font-medium"></p>
        </div>

    </main>

    <script type="module" src="./dashboard.js"></script>
</body>
</html>
