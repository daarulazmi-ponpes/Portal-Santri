
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login Santri | Daarul Azmi</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

  <main class="card login-card">

    <!-- LOGO PONDOK -->
    <div class="logo-pondok">
      <img
        src="./assets/logo-daarulazmi.png"
        alt="Logo Pondok Pesantren Daarul Azmi">
    </div>

    <h1 style="margin-top:20px">DAARUL AZMI</h1>
    <p class="muted">Portal Santri Pondok Pesantren</p>

    <form id="loginForm">

      <div id="nameField" hidden>
        <label for="fullName">Nama lengkap</label>
        <input
          type="text"
          id="fullName"
          autocomplete="name"
          maxlength="120"
          placeholder="Nama santri">
      </div>

      <label for="email">Email akun santri</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        required
        placeholder="akun@contoh.sch.id">

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
        minlength="6"
        placeholder="Password">

      <div id="confirmPasswordField" hidden>
        <label for="confirmPassword">Ulangi password</label>
        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="Ulangi password">
      </div>

      <p id="message" class="message" role="alert"></p>

      <button
        style="width:100%;margin-top:12px"
        id="submit">
        Masuk
      </button>

    </form>

    <p class="muted" style="font-size:14px">
      <span id="modePrompt">Belum punya akun?</span>
      <button id="toggleMode" type="button" class="text-button">Daftar</button>
    </p>
    <p class="muted" style="font-size:12px">
      Admin masuk dengan akun yang sudah diberi akses oleh pengelola.
    </p>

    <a href="https://daarulazmi.ponpes.id/">
      ← Kembali ke website utama
    </a>

  </main>

  <script type="module" src="./login.js"></script>

</body>
</html>
