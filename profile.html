<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Santri - Portal Daarul Azmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <header class="bg-blue-600 text-white p-4 shadow-md flex flex-wrap justify-between items-center gap-3">
        <a href="./dashboard.html?v=20261021-2" class="text-lg font-bold text-white no-underline">Portal Santri Daarul Azmi</a>
        <button id="logout-btn" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-sm transition">Keluar</button>
    </header>
    <nav aria-label="Navigasi dashboard" class="bg-slate-800 text-white px-4 py-3 shadow-md sticky top-0 z-10 flex gap-3 sm:gap-6 overflow-x-auto whitespace-nowrap">
        <a href="./dashboard.html?v=20261021-2" class="text-white hover:text-blue-200">Beranda</a>
        <a href="./profile.html?v=20261021-2" aria-current="page" class="text-white hover:text-blue-200">Profil Santri</a>
        <a href="./admin.html?v=20261021-2" class="text-white hover:text-blue-200">Panel Admin</a>
        <a href="https://daarulazmi.ponpes.id/" class="text-white hover:text-blue-200">Website Pondok</a>
    </nav>
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <section class="bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-xl font-bold mb-4 text-gray-800">Profil Santri</h1>
            <form id="profile-form" class="space-y-4">
                <div>
                    <label for="full-name" class="block text-sm font-medium text-gray-700">Nama Lengkap</label>
                    <input type="text" id="full-name" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" required placeholder="Masukkan nama lengkap santri" />
                </div>
                <div>
                    <label for="nis" class="block text-sm font-medium text-gray-700">NIS (Nomor Induk Siswa)</label>
                    <input type="text" id="nis" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Masukkan NIS" />
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700">Nomor Telepon</label>
                    <input type="text" id="phone" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" placeholder="Contoh: 08123456789" />
                </div>
                <div>
                    <label for="address" class="block text-sm font-medium text-gray-700">Alamat</label>
                    <textarea id="address" class="w-full mt-1 p-2 border rounded-md focus:ring focus:ring-blue-300" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
                </div>
                <button type="submit" id="save-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                    Simpan Profil
                </button>
            </form>
            <p id="profile-status" class="mt-3 text-sm font-medium" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script type="module" src="./dashboard.js?v=20261021-2"></script>
</body>
</html>
