<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profil Santri | Daarul Azmi</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="portal-page">
  <header class="portal-header">
    <a class="brand" href="./dashboard.html">DAARUL AZMI</a>
    <button id="logout-btn" class="portal-logout" type="button">Keluar</button>
  </header>
  <nav class="portal-nav" aria-label="Navigasi portal">
    <a href="./dashboard.html"><span aria-hidden="true">⌂</span> Beranda</a>
    <a href="./dashboard.html#tagihan"><span aria-hidden="true">▤</span> Tagihan</a>
    <a href="./dashboard.html#pembayaran"><span aria-hidden="true">◷</span> Histori Pembayaran</a>
    <a href="./dashboard.html#tabungan"><span aria-hidden="true">＄</span> Tabungan</a>
    <a href="./profile.html" aria-current="page"><span aria-hidden="true">●</span> Profil Santri</a>
    <a href="https://daarulazmi.ponpes.id/"><span aria-hidden="true">◆</span> Website Pondok</a>
  </nav>
  <main class="portal-main">
    <section class="portal-section profile-section">
      <div class="portal-section-heading">
        <div><p class="portal-eyebrow">AKUN SANTRI &amp; WALI SANTRI</p><h1>Profil Santri</h1></div>
      </div>
      <p class="profile-intro">Pastikan informasi santri selalu sesuai agar mudah dihubungi.</p>
      <form id="profile-form" class="profile-form">
        <div>
          <label for="full-name">Nama Lengkap</label>
          <input type="text" id="full-name" required placeholder="Masukkan nama lengkap santri">
        </div>
        <div>
          <label for="nis">NIS (Nomor Induk Siswa)</label>
          <input type="text" id="nis" placeholder="Masukkan NIS">
        </div>
        <div>
          <label for="phone">Nomor Telepon</label>
          <input type="tel" id="phone" placeholder="Contoh: 08123456789">
        </div>
        <div>
          <label for="address">Alamat</label>
          <textarea id="address" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
        </div>
        <button type="submit" id="save-btn">Simpan Profil</button>
      </form>
      <p id="profile-status" class="portal-status" role="status" aria-live="polite"></p>
    </section>
    <footer class="portal-footer">Portal Santri Daarul Azmi</footer>
  </main>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
